[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-mri-pathology-classification"
version = "0.1.0"
description = "Patient-level cardiac MRI pathology classification using a custom 3D ResNet-18."
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "pandas",
    "nibabel",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "onnx",
    "onnxruntime",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
]

pretrained = [
    "torchvision",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["cardiac_pathology"]
mypy_path = "src"
